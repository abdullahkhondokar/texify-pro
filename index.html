<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Texify Pro - Math & LaTeX Processor</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    
    <style>
        body { font-family: 'Inter', 'Segoe UI', Roboto, sans-serif; background-color: #f1f5f9; padding: 40px 20px; display: flex; justify-content: center; }
        .container { background-color: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 700px; }
        
        /* Branding Header */
        .branding { text-align: center; margin-bottom: 25px; }
        .branding h2 { color: #0f172a; margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .branding p { color: #64748b; font-size: 14px; margin: 5px 0 0; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }

        label { font-weight: 600; color: #334155; display: block; margin-top: 20px; margin-bottom: 8px; font-size: 13px; }
        
        textarea { width: 100%; height: 140px; padding: 15px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 15px; font-family: 'Fira Code', monospace; resize: vertical; box-sizing: border-box; transition: all 0.2s; background: #fff; }
        textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        
        /* Buttons */
        .btn-group { display: flex; gap: 12px; margin-top: 20px; }
        .btn { color: white; border: none; padding: 12px 20px; font-size: 14px; font-weight: 600; border-radius: 8px; cursor: pointer; flex: 1; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-main { background-color: #2563eb; }
        .btn-main:hover { background-color: #1d4ed8; }
        .btn-clear { background-color: #f1f5f9; color: #64748b; flex: 0.3; }
        .btn-clear:hover { background-color: #e2e8f0; color: #0f172a; }
        
        .action-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn-edit { background-color: #f59e0b; flex: 0.25; }
        .btn-preview { background-color: #8b5cf6; flex: 0.3; }
        .btn-copy { background-color: #10b981; flex: 0.45; }
        
        #outputBox { background-color: #f8fafc; color: #334155; font-weight: 600; }
        
        #previewContainer { display: none; margin-top: 25px; padding: 20px; background: white; border: 1px solid #e2e8f0; border-radius: 12px; }
        .preview-header { font-size: 11px; color: #94a3b8; font-weight: 700; text-transform: uppercase; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

<div class="container">
    <div class="branding">
        <h2>⚡ Texify Pro</h2>
        <p>Advanced Math & LaTeX Processor</p>
    </div>
    
    <label>SOURCE CONTENT (Rich Text Input)</label>
    <textarea id="inputBox" placeholder="Paste content from Word/Mathpix here..."></textarea>
    
    <div class="btn-group">
        <button class="btn btn-main" onclick="convertToLatex()">⚙️ Run Processor</button>
        <button class="btn btn-clear" onclick="clearAll()">🗑️ Reset</button>
    </div>
    
    <label>GENERATED SYNTAX (CMS Ready)</label>
    <textarea id="outputBox" readonly></textarea>
    
    <div class="action-group">
        <button class="btn btn-warning btn-edit" onclick="enableEdit()">✏️ Edit</button>
        <button class="btn btn-info btn-preview" onclick="previewLatex()">👁️ Preview</button>
        <button class="btn btn-copy" id="copyBtn" onclick="copyResult()">📋 Copy Output</button>
    </div>

    <div id="previewContainer">
        <div class="preview-header">Live Syntax Rendering</div>
        <div id="previewContent"></div>
    </div>
</div>

<script>
    // [আগের লজিক কোড এখানে থাকবে...]
    function convertToLatex() {
        let str = document.getElementById('inputBox').value;
        // ... (বাকি লজিক একই থাকবে)
        document.getElementById('outputBox').value = str; // উদাহরণের জন্য
    }
    // ... (বাকি সব ফাংশন)
</script>
</body>
</html>
