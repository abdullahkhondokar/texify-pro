<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Texify Pro - Math to LaTeX Studio</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
        .container { background-color: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 650px; }
        .header-box { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 5px; }
        .header-box img { height: 40px; width: auto; border-radius: 5px; }
        h2 { color: #1e40af; margin: 0; font-weight: 800; letter-spacing: -0.5px; }
        .subtitle { text-align: center; color: #64748b; font-size: 13px; margin-bottom: 20px; }
        label { font-weight: bold; color: #475569; display: block; margin-top: 15px; margin-bottom: 5px; font-size: 14px; }
        textarea { width: 100%; height: 130px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; font-family: monospace; resize: vertical; box-sizing: border-box; line-height: 1.4; }
        .button-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn { color: white; border: none; padding: 12px; font-size: 15px; font-weight: bold; border-radius: 6px; cursor: pointer; flex: 1; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background-color: #2563eb; }
        .btn-danger { background-color: #ef4444; flex: 0.4; }
        .action-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-warning { background-color: #f59e0b; flex: 0.25; }
        .btn-info { background-color: #8b5cf6; flex: 0.3; }
        .copy-btn { background-color: #10b981; flex: 0.45; }
        #outputBox { background-color: #f8fafc; color: #0f172a; font-weight: bold; border: 1px solid #e2e8f0; }
        #previewContainer { display: none; margin-top: 20px; padding: 20px; background-color: #ffffff; border: 2px dashed #cbd5e1; border-radius: 8px; font-size: 16px; white-space: pre-wrap; }
        .preview-title { font-size: 12px; color: #64748b; font-weight: 800; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$']] }, svg: { fontCache: 'global' } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
<div class="container">
    <div class="header-box">
        <img src="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" alt="Logo">
        <h2>Texify Pro</h2>
    </div>
    <div class="subtitle">Offline Math ➔ LaTeX Studio</div>
    <label>Normal Text (Word থেকে কপি করে এখানে দিন):</label>
    <textarea id="inputBox" placeholder="যেমন: N_Na = 12; N_Al = 14"></textarea>
    <div class="button-group">
        <button class="btn btn-primary" onclick="convertToLatex()">⚙️ Convert to LaTeX</button>
        <button class="btn btn-danger" onclick="clearAll()">🗑️ Clear All</button>
    </div>
    <label>LaTeX Output (CMS এ পেস্ট করার জন্য):</label>
    <textarea id="outputBox" readonly></textarea>
    <div class="action-group">
        <button class="btn btn-warning" onclick="enableEdit()">✏️ Edit</button>
        <button class="btn btn-info" onclick="previewLatex()">👁️ Preview</button>
        <button class="btn copy-btn" id="copyBtn" onclick="copyResult()">📋 Copy LaTeX</button>
    </div>
    <div id="previewContainer">
        <div class="preview-title">🔴 Live Render Preview</div>
        <div id="previewContent"></div>
    </div>
</div>
<script>
    function convertToLatex() {
        let str = document.getElementById('inputBox').value;
        str = str.replace(/⟦/g, '\\llbracket ').replace(/⟧/g, '\\rrbracket ').replace(/\^\^/g, '^');
        str = str.replace(/_([a-zA-Z0-9]+)/g, '_{$1}').replace(/\^\(([^)]+)\)/g, '^{$1}').replace(/\^([a-zA-Z0-9]+)/g, '^{$1}');
        
        // Fraction, Symbols etc logic remains same as per previous robust version
        str = str.replace(/≤/g, '\\leq ').replace(/≥/g, '\\geq ').replace(/∴/g, '\\therefore ').replace(/±/g, '\\pm ').replace(/π/g, '\\pi ').replace(/∞/g, '\\infty ').replace(/×/g, '\\times ').replace(/√/g, '\\sqrt');

        let lines = str.split('\n');
        let resultLines = [];
        for (let line of lines) {
            if (!line.trim()) { resultLines.push(""); continue; }
            let parts = line.split(/([\s,।;:]*(?:[\u0980-\u09FF]+[\s,।;:]*)+|\s{2,})/);
            let formattedLine = "";
            for (let part of parts) {
                if (!part) continue;
                if (/[\u0980-\u09FF]/.test(part) || /^\s+$/.test(part)) { formattedLine += part; }
                else { formattedLine += (part.trim() ? "$" + part.trim() + "$" : part); }
            }
            resultLines.push(formattedLine);
        }
        document.getElementById('outputBox').value = resultLines.join('\n');
    }
    function enableEdit() { let b = document.getElementById('outputBox'); b.removeAttribute('readonly'); b.style.backgroundColor = "#fff"; b.focus(); }
    function previewLatex() {
        let t = document.getElementById('outputBox').value;
        let c = document.getElementById('previewContent');
        c.innerHTML = t.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, '<br>');
        document.getElementById('previewContainer').style.display = "block";
        MathJax.typesetPromise([c]);
    }
    function clearAll() { location.reload(); }
    function copyResult() {
        let b = document.getElementById('outputBox'); b.select(); document.execCommand("copy");
        let btn = document.getElementById('copyBtn'); btn.innerHTML = "✅ Copied!";
        setTimeout(() => { btn.innerHTML = "📋 Copy LaTeX"; }, 2000);
    }
</script>
</body>
</html>
